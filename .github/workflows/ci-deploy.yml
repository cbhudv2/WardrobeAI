name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: wardrobe-ai-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.13.9
          uv sync --frozen --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest

  build-and-deploy:
    needs: test
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR for build
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/cbhudv2/wardrobeai:${{ github.sha }}

      - name: Configure strict SSH client
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/wardrobe_deploy
          chmod 600 ~/.ssh/wardrobe_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create protected runtime environment
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
          TELEGRAM_DAILY_CHAT_ID: ${{ secrets.TELEGRAM_DAILY_CHAT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          umask 077
          {
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
            printf 'TELEGRAM_ALLOWED_USER_IDS=%s\n' "$TELEGRAM_ALLOWED_USER_IDS"
            printf 'TELEGRAM_DAILY_CHAT_ID=%s\n' "$TELEGRAM_DAILY_CHAT_ID"
            printf 'MISTRAL_API_KEY=%s\n' "$MISTRAL_API_KEY"
            printf 'APP_ENV=production\nLOG_LEVEL=INFO\n'
            printf 'HTTP_HOST=0.0.0.0\nHTTP_PORT=3000\n'
            printf 'DATABASE_PATH=/data/wardrobe.sqlite3\nBACKUP_DIR=/backups\n'
            printf 'LEGACY_WARDROBE_PATH=/app/legacy_data/wardrobe.json\n'
            printf 'LEGACY_HISTORY_PATH=/app/legacy_data/outfit_history.json\n'
            printf 'MISTRAL_BASE_URL=https://api.mistral.ai/v1\n'
            printf 'MISTRAL_MODEL=zai-glm-5-3-flash\nMISTRAL_REASONING_EFFORT=low\n'
            printf 'WEATHER_BASE_URL=https://api.open-meteo.com/v1\n'
            printf 'WEATHER_LATITUDE=42.4304\nWEATHER_LONGITUDE=19.2594\n'
            printf 'WEATHER_LOCATION_NAME=Podgorica\nAPP_TIMEZONE=Europe/Podgorica\n'
            printf 'DAILY_SUGGESTION_TIME=07:00\n'
            printf 'DAILY_SUGGESTION_WEEKDAYS=MON,TUE,WED,THU,FRI\n'
            printf 'DEPLOY_HOST_PORT=3000\nIMAGE_TAG=%s\n' "${{ github.sha }}"
          } > deploy/.env.runtime

      - name: Upload deployment files
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          SSH="ssh -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes"
          rsync -az --delete \
            --exclude '.env*' --exclude 'data/' --exclude 'backups/' \
            -e "$SSH" deploy/ "$VPS_USER@$VPS_HOST:/srv/apps/wardrobe-ai/"
          scp -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            deploy/.env.runtime "$VPS_USER@$VPS_HOST:/srv/apps/wardrobe-ai/.env.tmp"
          ssh -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "chmod 600 /srv/apps/wardrobe-ai/.env.tmp && mv /srv/apps/wardrobe-ai/.env.tmp /srv/apps/wardrobe-ai/.env"

      - name: Pull and deploy through rootless Docker
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh \
            -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"
          ssh -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "/home/deploy/bin/deploy-app wardrobe-ai deploy"
          ssh -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "docker logout ghcr.io"

      - name: Verify private health over SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          ssh -i ~/.ssh/wardrobe_deploy -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "curl --fail --silent --show-error --retry 12 --retry-delay 5 http://127.0.0.1:3000/health"

