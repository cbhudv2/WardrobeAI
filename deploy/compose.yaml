services:
  api:
    image: ghcr.io/cbhudv2/wardrobeai:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${DEPLOY_HOST_PORT:-3000}:3000"
    volumes:
      - wardrobe_data:/data
      - wardrobe_backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s

volumes:
  wardrobe_data:
    name: wardrobe-ai-data
  wardrobe_backups:
    name: wardrobe-ai-backups

